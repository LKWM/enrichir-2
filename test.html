// ── RESULTS ───────────────────────────────────────────────────────
{ type:'results' }

const TOTAL_QUESTIONS = 20;
const MAX_SCORE       = 20;


async function initAudio() {
    if (audioCtxInited) return;
    try {
        await Tone.start();
        completionSynth = new Tone.PolySynth(Tone.Synth).toDestination();
        completionSynth.volume.value = 4;
        pageTurnSynth   = new Tone.MembraneSynth({
            pitchDecay:0.008, octaves:1,
            oscillator:{type:'sine'},
            envelope:{attack:0.001,decay:0.1,sustain:0,release:0.1}
        }).toDestination();
        pageTurnSynth.volume.value = 6;
        correctSynth = new Tone.Synth({
            oscillator:{type:'triangle'},
            envelope:{attack:0.001,decay:0.15,sustain:0,release:0.1}
        }).toDestination();
        correctSynth.volume.value = 4;
        audioCtxInited = true;
    } catch(e){ console.warn("Audio init failed",e); }
}
function playSuccessSound(){ if(correctSynth) correctSynth.triggerAttackRelease("C5","16n"); }
function stopCurrentAudio(){
    if(autoPlayTimer){clearTimeout(autoPlayTimer);autoPlayTimer=null;}
    if(currentAudioObj){
        currentAudioObj.pause();currentAudioObj.currentTime=0;
        currentAudioObj.onended=null;currentAudioObj=null;
    }
}
function playAudio(src){
    stopCurrentAudio();if(!src)return;
    currentAudioObj=new Audio(src);
    const p=currentAudioObj.play();
    if(p!==undefined)p.catch(e=>{if(e.name!=='AbortError')console.error(e);});
}
function playPageTurnSound(){if(pageTurnSynth)pageTurnSynth.triggerAttackRelease("C2","32n");}

// ─────────────────────────────────────────────
// TIMER
// ─────────────────────────────────────────────
function startTimer(){
    if(timerStarted)return;
    timerStarted=true;
    timerInterval=setInterval(()=>{
        timeRemaining--;
        updateTimerDisplay();
        if(timeRemaining<=0){clearInterval(timerInterval);forceFinish();}
    },1000);
}
function updateTimerDisplay(){
    const el=document.getElementById('timer-display');if(!el)return;
    const m=Math.floor(timeRemaining/60),s=timeRemaining%60;
    el.innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.className='font-mono font-bold text-fluid-xs bg-gray-100 px-3 py-1 rounded-full whitespace-nowrap flex-shrink-0 ';
    if(timeRemaining<=60)el.classList.add('timer-danger');
    else if(timeRemaining<=300)el.classList.add('timer-warning');
    else el.classList.add('timer-normal');
}
function forceFinish(){
    stopCurrentAudio();isRecording=false;
    currentPage=pages.length-1;renderPage();
}

const container    =document.getElementById('content-area');

const header       =document.getElementById('header');
const footer       =document.getElementById('footer');
const pageIndicator=document.getElementById('page-indicator');
const progressFill =document.getElementById('progress-bar-fill');

function enableNext(){
    btnNext.disabled=false;
    btnNext.classList.remove('bg-gray-300','cursor-not-allowed');
    btnNext.classList.add('bg-indigo-600','hover:bg-indigo-700');
}
function disableNext(){
    btnNext.disabled=true;
    btnNext.classList.add('bg-gray-300','cursor-not-allowed');
    btnNext.classList.remove('bg-indigo-600','hover:bg-indigo-700');
}

// ─────────────────────────────────────────────
// ROUTER
// ─────────────────────────────────────────────
function renderPage(){
    stopCurrentAudio();
    container.innerHTML='';
    const page=pages[currentPage];
    if(page.type==='cover'||page.type==='results'){
        header.classList.add('hidden');footer.classList.add('hidden');
    } else {
        header.classList.remove('hidden');footer.classList.remove('hidden');
        pageIndicator.innerText=`${page.qNum} / ${TOTAL_QUESTIONS}`;
        progressFill.style.width=`${((page.qNum-1)/TOTAL_QUESTIONS)*100}%`;
        updateTimerDisplay();
    }
    switch(page.type){
        case'cover':    renderCover();         break;
        case'mcq':      renderMCQ(page);       break;
        case'listening':renderListening(page); break;
        case'mcq-multi':renderMCQMulti(page);  break;
        case'writing':  renderWriting(page);   break;
        case'speaking': renderSpeaking(page);  break;
        case'results':  renderResults();       break;
    }
}

    const saved=(pageAnswers[currentPage]||{});
    const selected=saved.selectedIdx!==undefined?saved.selectedIdx:null;
    const optHtml=page.options.map((opt,i)=>`
      <button class="mcq-option text-fluid-sm ${selected===i?'selected':''}" id="opt-${i}" onclick="selectMCQ(${i})">
        <span class="font-bold text-indigo-300 flex-shrink-0">${String.fromCharCode(65+i)}</span>
        <span class="korean-text">${opt}</span>
      </button>`).join('');
    container.innerHTML=`
    <div class="page-wrapper fade-in">
      <div class="flex flex-col items-center w-full gap-[2vh]">
        <p class="text-gray-500 font-bold uppercase tracking-widest text-fluid-sm">${page.instruction}</p>
        ${page.question?`<div class="card-box py-[2.5vh]"><span class="text-fluid-lg font-bold text-indigo-900 korean-text">${page.question}</span></div>`:''}

function selectMCQ(idx){
    document.querySelectorAll('.mcq-option').forEach((el,i)=>el.classList.toggle('selected',i===idx));
    if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
    pageAnswers[currentPage].selectedIdx=idx;
    enableNext();
}
function scoreMCQ(page){
    if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
    pageAnswers[currentPage].score=(pageAnswers[currentPage].selectedIdx===page.answer)?1:0;
}

function renderMCQMulti(page){
    if(!pageAnswers[currentPage])pageAnswers[currentPage]={selected:[]};
    const selected=pageAnswers[currentPage].selected||[];

    const optHtml=page.options.map((opt,i)=>{
        const isSel=selected.includes(i);
        return `
      <button class="mcq-option text-fluid-sm ${isSel?'selected':''}" id="opt-${i}" onclick="toggleMCQMulti(${i})">
        <span class="font-bold text-indigo-300 flex-shrink-0">${String.fromCharCode(65+i)}</span>
        <span class="korean-text">${opt}</span>
      </button>`;
    }).join('');

    container.innerHTML=`
    <div class="page-wrapper fade-in">
      <div class="flex flex-col items-center w-full gap-[2vh]">
        <p class="text-gray-500 font-bold uppercase tracking-widest text-fluid-sm">${page.instruction}</p>
        ${page.question?`<div class="card-box py-[2.5vh]"><span class="text-fluid-lg font-bold text-indigo-900 korean-text">${page.question}</span></div>`:''}
        <div class="flex flex-col items-center w-full gap-[1.5vh]">${optHtml}</div>
      </div>
    </div>`;
    if(selected.length>0)enableNext();else disableNext();
}
function toggleMCQMulti(idx){
    if(!pageAnswers[currentPage])pageAnswers[currentPage]={selected:[]};
    const state=pageAnswers[currentPage];
    if(!state.selected)state.selected=[];
    const pos=state.selected.indexOf(idx);
    if(pos>=0)state.selected.splice(pos,1);
    else state.selected.push(idx);
    document.querySelectorAll('.mcq-option').forEach((el,i)=>el.classList.toggle('selected',state.selected.includes(i)));
    if(state.selected.length>0)enableNext();else disableNext();
}
function scoreMCQMulti(page){
    if(!pageAnswers[currentPage])pageAnswers[currentPage]={selected:[]};
    const state=pageAnswers[currentPage];
    const sel=(state.selected||[]).slice().sort();
    const correct=page.answer.slice().sort();
    const isMatch=sel.length===correct.length&&sel.every((v,i)=>v===correct[i]);
    state.score=isMatch?1:0;
}

function onWriteInput(val){
    if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
    pageAnswers[currentPage].userText=val;
    if(val.trim())enableNext();else disableNext();
}
function scoreWriting(page){
    if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
    const ans=pageAnswers[currentPage];
    const raw=(ans.userText||'').trim();

    // ── gemini: 전송 후 백그라운드 채점 (결과 화면에서 대기) ──
    if(page.specialScoring==='gemini'){ans.userText=raw;ans.pending=gradeWritingGemini(page,raw,ans);return;}

    const hasInvalidPunct=/[!?,。！？]/.test(raw);
    if(hasInvalidPunct){ans.score=0;ans.userText=raw;return;}

    const norm=s=>s.replace(/[.。]/g,'').trim();
    const user=norm(raw);

    // ── nospace: 띄어쓰기 무시, 마침표 유무만 허용 ──
    if(page.specialScoring==='nospace'){
        const ns=s=>s.replace(/[.。\s]/g,'');
        const matched=page.fullAnswers.some(ref=>ns(user)===ns(ref));
        ans.score=matched?1:0;ans.userText=raw;return;
    }

    // ── pattern: fullAnswers(exact)=1pt, halfAnswers(exact, espacement)=0.5pt ──
    if(page.specialScoring==='pattern'){
        for(const ref of page.fullAnswers){
            if(user===norm(ref)){ans.score=1;ans.userText=raw;return;}
        }
        for(const ref of page.halfAnswers){
            if(user===norm(ref)){ans.score=0.5;ans.userText=raw;return;}
        }
        ans.score=0;ans.userText=raw;return;
    }

    // ── exact: fullAnswers(exact match only)=1pt ──
    if(page.specialScoring==='exact'){
        const matched=page.fullAnswers.some(ref=>user===norm(ref));
        ans.score=matched?1:0;
        ans.userText=raw;return;
    }

    // ── q14-style (legacy, unused now but kept for compat) ──
    if(page.specialScoring==='q14'){
        for(const ref of page.fullAnswers){
            if(calcSimilarity(user,norm(ref))>=0.85){ans.score=1;ans.userText=raw;return;}
        }
        for(const ref of page.halfAnswers){
            if(calcSimilarity(user,norm(ref))>=0.85){ans.score=0.5;ans.userText=raw;return;}
        }
        ans.score=0;ans.userText=raw;return;
    }

    // ── Standard fallback: acceptedAnswers/answer, exact match with 입니다 expansion ──
    const baseAnswers=(page.fullAnswers||page.acceptedAnswers||[page.answer]);
    const expanded=[];
    baseAnswers.forEach(ref=>{
        expanded.push(ref);
        const rn=norm(ref);
        const r2=rn.replace(/예요$/,'입니다').replace(/이에요$/,'입니다');
        if(r2!==rn)expanded.push(r2);
    });
    const matched=expanded.some(ref=>user===norm(ref));
    ans.score=matched?1:0;
    ans.userText=raw;
}
async function gradeWritingGemini(page,text,ans){
    try{
        const res=await fetch(GEMINI_URL,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                contents:[{role:"user",parts:[{text:text}]}],
                systemInstruction:page.systemInstruction,
                model:"gemini-3.8-flash",
                permit:lessonPermit,
                lesson_id:lessonId
            })
        });
        if(!res.ok)throw new Error(`API ${res.status}`);
        const result=await res.json();
        const m=String(result.text||'').match(/\d+(?:\.\d+)?/);
        ans.score=m?Math.min(1,Math.max(0,parseFloat(m[0]))):0;
    }catch(e){
        console.error("Gemini writing grade error",e);
        ans.score=0;
    }
}
function calcSimilarity(a,b){
    if(a===b)return 1;if(!a||!b)return 0;
    const la=a.length,lb=b.length;
    const dp=Array.from({length:la+1},(_,i)=>Array.from({length:lb+1},(_,j)=>i===0?j:j===0?i:0));
    for(let i=1;i<=la;i++)for(let j=1;j<=lb;j++)
        dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    return 1-dp[la][lb]/Math.max(la,lb);
}

                  class="rec-btn-base bg-white border-4 border-gray-100 text-indigo-600 shadow-lg hover:border-indigo-200 hover:scale-105"
                  style="width:clamp(7vh,12vmin,12vh);height:clamp(7vh,12vmin,12vh);"
                  ${alreadyDone?'disabled':''}>
            ${alreadyDone?`<i class="ph ph-check icon-fluid-md text-green-500"></i>`:`<i class="ph ph-microphone icon-fluid-lg"></i>`}
          </button>
          <div id="speak-feedback" class="text-fluid-sm font-medium text-gray-500 text-center"
               style="min-height:clamp(4vh,6vmin,7vh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5vh;">
            ${alreadyDone?`<span class="text-green-500 font-bold">Enregistrement reçu ✓</span>`:`<span>Appuyez pour répondre</span><span class="text-fluid-xs text-gray-300">1 seul essai</span>`}
          </div>
        </div>
      </div>
    </div>`;
    // Auto-play question audio on load (after pageTurnSound ends ~100ms)
    if(page.audioPrompt&&!pState.autoPlayed&&pState.playsLeft>0){
        autoPlayTimer=setTimeout(()=>{pState.autoPlayed=true;playPromptAudio();},400);
    }
    if(alreadyDone){enableNext();return;}
    disableNext();
    setupGeminiRecording(page);
}

function playPromptAudio(){
    const st=pageAnswers[currentPage];
    const page=pages[currentPage];
    if(!st||st.playsLeft<=0)return;
    st.playsLeft--;
    playAudio(page.audioPrompt);
    const badge=document.getElementById('plays-badge');
    if(badge)badge.innerText=st.playsLeft;
    if(st.playsLeft<=0){
        const btn=document.getElementById('audio-btn');
        if(btn){btn.disabled=true;btn.classList.add('opacity-40','cursor-not-allowed');}
    }
}

// ── Clova recording ───────────────────────────
function setupClovaRecording(page){
    const btn=document.getElementById('rec-btn');
    const fb=document.getElementById('speak-feedback');
    if(!pageAnswers[currentPage])pageAnswers[currentPage]={attemptsUsed:0};
    const state=pageAnswers[currentPage];

    btn.onclick=async()=>{
        if(isRecording){clearTimeout(recordingTimeout);stopSpeakRecording(btn,fb);return;}
        if(state.attemptsUsed>=page.maxAttempts){return;}
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:true});
            initAudio();
            mediaRecorder=new MediaRecorder(stream);
            audioChunks=[];
            mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
            mediaRecorder.onstop=async()=>{
                const blob=new Blob(audioChunks,{type:'audio/webm'});
                const reader=new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend=async()=>{
                    const b64=reader.result.split(',')[1];
                    state.attemptsUsed=(state.attemptsUsed||0)+1;
                    const attLeft=page.maxAttempts-state.attemptsUsed;
                    if(attLeft<=0)btn.disabled=true;
                    fb.innerHTML=`<span class="text-indigo-400">Analyse en cours…</span>`;
                    await processClovaSpeech(b64,page.referenceTexts,fb,page,btn);
                };
                stream.getTracks().forEach(t=>t.stop());
            };
            mediaRecorder.start();isRecording=true;
            btn.classList.add('recording-pulse','bg-red-500','text-white','border-red-500');
            btn.classList.remove('bg-white','text-indigo-600','border-gray-100');
            btn.innerHTML=`<i class="ph ph-stop icon-fluid-md"></i>`;
            fb.innerHTML=`<span class="text-red-500 font-bold">Enregistrement…</span>`;
            recordingTimeout=setTimeout(()=>{if(isRecording)stopSpeakRecording(btn,fb);},8000);
        }catch(err){
            console.error(err);
            fb.innerHTML=`<span class="text-red-400">Accès au micro refusé.</span>`;
        }
    };
}

function stopSpeakRecording(btn,fb){
    if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();
    clearTimeout(recordingTimeout);isRecording=false;
    btn.classList.remove('recording-pulse','bg-red-500','text-white','border-red-500');
    btn.classList.add('bg-white','text-indigo-600','border-gray-100');
    btn.innerHTML=`<i class="ph ph-microphone icon-fluid-lg"></i>`;
}

async function processClovaSpeech(b64,referenceTexts,fbEl,page,btnEl){
    try{
        const payload = {
            contents: [{ role: "user", parts: [{ inline_data: { mime_type: "audio/webm", data: b64 } }] }],
            systemInstruction: `유저의 한국어 발화를 전사한다.
1. 한글 외에 다른 문자는 사용할 수 없음.
2. 발화를 하지 않는 구간이나 외국어로 발화하는 구간은 전사하지 않는다.
3. 의미 없는 filler word나 말더듬기, 공백 등은 삭제하고 실제 단어나 문장만 전사한다.
4. 문법, 발음 오류는 교정 없이 들리는 대로 전사한다.`,
            model: "gemini-3.8-flash",
            permit: lessonPermit,
            lesson_id: lessonId
        };

        const res = await fetch(GEMINI_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if(!res.ok)throw new Error("API Error");
        const data=await res.json();
        const recognized=(data.text||'').trim();
        const norm=s=>s.replace(/[.!?,。！？]/g,'').trim();
        let best=0;
        (referenceTexts||[]).forEach(ref=>{
            const sim=calcSimilarity(norm(recognized),norm(ref));
            if(sim>best)best=sim;
        });
        let tierScore=0;
        if(page.specialScoring==='half-pattern'){
            // 정답과 일치=1, "만 먹어요"만 맞으면 0.5
            const ns=s=>s.replace(/[.!?,。！？\s]/g,'');
            const rec=ns(recognized);
            if((referenceTexts||[]).some(ref=>rec===ns(ref)))tierScore=1;
            else if(rec.includes(ns(page.halfPattern)))tierScore=0.5;
        } else {
            // Tiered scoring: <60%=0, 60-80%=0.5, 80-90%=0.7, >=90%=1
            if(best>=0.9)tierScore=1;
            else if(best>=0.8)tierScore=0.7;
            else if(best>=0.6)tierScore=0.5;
        }

        if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
        const state=pageAnswers[currentPage];
        const attLeft=page.maxAttempts-(state.attemptsUsed||0);

        if(tierScore>0){
            state.score=tierScore;state.submitted=true;
            btnEl.disabled=true;
            btnEl.innerHTML=`<i class="ph ph-check icon-fluid-md text-green-500"></i>`;
            fbEl.innerHTML=`<span class="text-green-500 font-bold">Enregistrement reçu ✓</span>`;
            playSuccessSound();
            enableNext();
        } else if(attLeft<=0){
            state.score=0;state.submitted=true;
            fbEl.innerHTML=`<span class="text-orange-400">Essais épuisés.</span>`;
            enableNext();
        } else {
            fbEl.innerHTML=`<span class="text-orange-400">Réessayez. (${attLeft} essai${attLeft>1?'s':''} restant${attLeft>1?'s':''})</span>`;
            btnEl.disabled=false;
        }
    }catch(e){
        console.error(e);
        if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
        pageAnswers[currentPage].score=0;pageAnswers[currentPage].submitted=true;
        fbEl.innerHTML=`<span class="text-orange-400">Erreur serveur.</span>`;
        enableNext();
    }
}

// ── Gemini recording ──────────────────────────

function setupGeminiRecording(page){
    const btn=document.getElementById('rec-btn');
    const fb=document.getElementById('speak-feedback');

    btn.onclick=async()=>{
        if(isRecording){clearTimeout(recordingTimeout);stopSpeakRecording(btn,fb);return;}
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:true});
            initAudio();
            mediaRecorder=new MediaRecorder(stream);
            audioChunks=[];
            mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
            mediaRecorder.onstop=async()=>{
                const blob=new Blob(audioChunks,{type:'audio/webm'});
                stream.getTracks().forEach(t=>t.stop());
                btn.disabled=true;
                fb.innerHTML=`<span class="text-indigo-400">Analyse en cours…</span>`;
                await processGeminiSpeech(blob,fb,page);
            };
            mediaRecorder.start();isRecording=true;
            btn.classList.add('recording-pulse','bg-red-500','text-white','border-red-500');
            btn.classList.remove('bg-white','text-indigo-600','border-gray-100');
            btn.innerHTML=`<i class="ph ph-stop icon-fluid-md"></i>`;
            fb.innerHTML=`<span class="text-red-500 font-bold">Enregistrement…</span>`;
            recordingTimeout=setTimeout(()=>{if(isRecording)stopSpeakRecording(btn,fb);},8000);
        }catch(err){
            console.error(err);
            fb.innerHTML=`<span class="text-red-400">Accès au micro refusé.</span>`;
        }
    };
}

async function processGeminiSpeech(blob,fbEl,page){
    try{
        const reader=new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend=async()=>{
            const base64data=reader.result.split(',')[1];
            const mimeType=blob.type?blob.type.split(';')[0]:'audio/webm';
            try{
                const res=await fetch(GEMINI_URL,{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        contents:[{role:"user",parts:[{inline_data:{mime_type:mimeType,data:base64data}}]}],
                        systemInstruction:page.systemInstruction,
                        model:"gemini-3.8-flash",
                        permit:lessonPermit,
                        lesson_id:lessonId
                    })
                });
                if(!res.ok)throw new Error(`API ${res.status}`);
                const result=await res.json();
                const rawText=(result.text||'').trim();
                const sMatch=rawText.match(/\[점수\]([\s\S]*?)\[\/점수\]/);
                const score=sMatch?(parseFloat(sMatch[1].trim())||0):0;
                if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
                pageAnswers[currentPage].score=Math.min(1,Math.max(0,score));
                pageAnswers[currentPage].submitted=true;
                fbEl.innerHTML=`<span class="text-green-500 font-bold">Enregistrement reçu ✓</span>`;
                enableNext();
            }catch(apiErr){
                console.error("Gemini API Error",apiErr);
                if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
                pageAnswers[currentPage].score=0;pageAnswers[currentPage].submitted=true;
                fbEl.innerHTML=`<span class="text-orange-400">Erreur serveur.</span>`;
                enableNext();
            }
        };
    }catch(err){
        console.error(err);
        if(!pageAnswers[currentPage])pageAnswers[currentPage]={};
        pageAnswers[currentPage].score=0;pageAnswers[currentPage].submitted=true;
        fbEl.innerHTML=`<span class="text-orange-400">Erreur de traitement.</span>`;
        enableNext();
    }
}

// ─────────────────────────────────────────────
// RESULTS — per-question score rows
// ─────────────────────────────────────────────
async function renderResults(){
    clearInterval(timerInterval);
    footer.classList.add('hidden');header.classList.add('hidden');
    await Promise.all(Object.values(pageAnswers).map(a=>a&&a.pending).filter(Boolean));

    let total=0;
    const questionPages=pages.slice(1,TOTAL_QUESTIONS+1);
    questionPages.forEach((_,i)=>{total+=((pageAnswers[i+1]||{}).score||0);});
    total=Math.round(total*10)/10;
    const pct=total/MAX_SCORE;
    const grade=pct>=0.9?"Excellent !":pct>=0.75?"Très bien !":pct>=0.6?"Assez bien.":"À revoir.";
    const scoreColor=pct>=0.8?'text-green-600':pct>=0.6?'text-indigo-600':'text-orange-500';

    const typeLabel=t=>t==='mcq'?'QCM':t==='mcq-multi'?'QCM':t==='listening'?'Écoute':t==='writing'?'Écriture':'Expression orale';

    const rowsHtml=questionPages.map((p,i)=>{
        const sc=Math.round(((pageAnswers[i+1]||{}).score||0)*100)/100;
        const isGreen=sc>=1;
        const isBlue=sc>0&&sc<1;
        const rowCls=isGreen?'score-row-green':isBlue?'score-row-blue':'score-row-red';
        const iconCls=isGreen?'ph-check-circle text-green-500':isBlue?'ph-minus-circle text-blue-500':'ph-x-circle text-red-400';
        const scoreTxtCls=isGreen?'text-green-600 font-bold':isBlue?'text-blue-600 font-bold':'text-red-500 font-bold';
        const scoreTxt=isGreen?'1 / 1':isBlue?`${sc} / 1`:'0 / 1';
        return `
        <div class="score-row ${rowCls}">
          <div class="flex items-center gap-[1.5vmin]">
            <i class="ph ${iconCls}" style="font-size:clamp(1rem,2.2vmin,1.6rem);flex-shrink:0;"></i>
            <span class="text-fluid-xs text-gray-600 font-semibold">Q${p.qNum}<span class="font-normal text-gray-400"> — ${typeLabel(p.type)}</span></span>
          </div>
          <span class="text-fluid-xs ${scoreTxtCls}">${scoreTxt}</span>
        </div>`;
    }).join('');

    container.innerHTML=`
    <div class="page-wrapper fade-in">
      <div class="flex flex-col items-center w-full gap-[2vh] max-w-[700px]" style="height:100%;justify-content:center;">
        <div class="flex flex-col items-center gap-[0.8vh]">
          <div style="width:clamp(10vh,14vmin,14vh);height:clamp(10vh,14vmin,14vh);background:#eef2ff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 8px rgba(0,0,0,0.08);">
            <span class="text-fluid-xl font-black ${scoreColor}">${total}</span>
            <span class="text-fluid-xs text-gray-400 font-semibold">/ ${MAX_SCORE}</span>
          </div>
          <span class="text-fluid-lg font-bold text-gray-700">${grade}</span>
        </div>
        <div class="w-full flex flex-col gap-[0.8vh]" style="overflow-y:auto;max-height:52vh;">
          ${rowsHtml}
        </div>

      </div>
    </div>`;

    initAudio().then(()=>{
        if(completionSynth)completionSynth.triggerAttackRelease(["C5","E5","G5","C6"],"4n");
        if(window.parent){
            window.parent.postMessage({type:'test_complete',score:total,maxScore:MAX_SCORE},'*');
            window.parent.postMessage('lessonCompleted','*');
        }
    });
}

function restartTest(){
    Object.keys(pageAnswers).forEach(k=>delete pageAnswers[k]);
    clearInterval(timerInterval);
    timeRemaining=EXAM_DURATION_SEC;timerStarted=false;
    currentPage=0;isRecording=false;
    renderPage();
}

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function nextPage(){
    if(!audioCtxInited)initAudio();
    playPageTurnSound();
    const page=pages[currentPage];
    if(page.type==='mcq')      scoreMCQ(page);
    if(page.type==='listening')scoreListening(page);
    if(page.type==='mcq-multi')scoreMCQMulti(page);
    if(page.type==='writing')  scoreWriting(page);
    if(currentPage<pages.length-1){currentPage++;renderPage();}
}
btnNext.addEventListener('click',nextPage);

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderPage();

</script>
